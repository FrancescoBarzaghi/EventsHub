<div class="min-h-screen bg-background flex flex-col justify-between">
  <div class="flex-1 flex items-center justify-center bg-muted/20 px-4 py-16">
    <div class="w-full max-w-[400px] border border-border bg-card text-card-foreground rounded-lg shadow-sm overflow-hidden">
      
      <div class="flex bg-muted p-1 m-4 rounded-lg">
        <button type="button" 
                (click)="switchTab('login')" 
                [class.bg-background]="activeTab === 'login'" 
                [class.shadow-sm]="activeTab === 'login'" 
                class="flex-1 text-center font-medium text-sm py-1.5 rounded-md transition-all cursor-pointer">
          Accedi
        </button>
        <button type="button" 
                (click)="switchTab('register')" 
                [class.bg-background]="activeTab === 'register'" 
                [class.shadow-sm]="activeTab === 'register'" 
                class="flex-1 text-center font-medium text-sm py-1.5 rounded-md transition-all cursor-pointer">
          Registrati
        </button>
      </div>

      <form (ngSubmit)="submitAuth()" class="p-6 pt-2 space-y-4">
        <div class="space-y-1">
          <h2 class="text-2xl font-bold font-serif-title tracking-tight">
            {{ activeTab === 'login' ? 'Accedi all\'app' : 'Crea un account' }}
          </h2>
          <p class="text-sm text-muted-foreground">
            {{ activeTab === 'login' ? 'Inserisci le credenziali per entrare nel tuo pannello' : 'Inserisci i dati personali richiesti' }}
          </p>
        </div>

        @if (errorMessage) {
          <div class="p-3 text-xs font-medium rounded-md border" 
               [ngClass]="errorMessage.includes('successo') ? 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' : 'bg-destructive/10 text-destructive border-destructive/20'">
            {{ errorMessage }}
          </div>
        }

        @if (activeTab === 'register') {
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-foreground">Nome Completo</label>
            <div class="relative">
              <lucide-icon name="user" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></lucide-icon>
              <input type="text" [(ngModel)]="name" name="name" placeholder="Mario Rossi" class="w-full bg-background border border-input rounded-md h-9 pl-9 pr-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-foreground">Tipo Account</label>
            <select [(ngModel)]="role" name="role" class="w-full bg-background border border-input rounded-md h-9 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring">
              <option value="user">Partecipante (Acquisto Biglietti)</option>
              <option value="organizer">Organizzatore (Gestione e Creazione)</option>
            </select>
          </div>
        }

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-foreground">Indirizzo Email</label>
          <div class="relative">
            <lucide-icon name="mail" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></lucide-icon>
            <input type="email" [(ngModel)]="email" name="email" required placeholder="nome@esempio.com" class="w-full bg-background border border-input rounded-md h-9 pl-9 pr-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-foreground">Password di accesso</label>
          <div class="relative">
            <lucide-icon name="lock" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></lucide-icon>
            <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" class="w-full bg-background border border-input rounded-md h-9 pl-9 pr-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="w-full bg-primary text-primary-foreground font-medium text-sm rounded-md hover:bg-primary/90 h-9 transition-colors shadow-sm mt-2 disabled:opacity-50 flex items-center justify-center">
          {{ isLoading ? 'Elaborazione...' : (activeTab === 'login' ? 'Connetti account' : 'Registra nuovo profilo') }}
        </button>
      </form>

    </div>
  </div>
  <app-footer></app-footer>
</div>
