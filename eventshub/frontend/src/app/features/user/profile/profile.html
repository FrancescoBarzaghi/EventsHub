<div class="min-h-screen bg-background flex flex-col justify-between">
  <div class="max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="border border-border bg-card text-card-foreground rounded-lg shadow-sm overflow-hidden">
      
      <div class="p-6 border-b border-border space-y-1">
        <h2 class="text-2xl font-bold font-serif-title tracking-tight">Impostazioni Profilo</h2>
        <p class="text-sm text-muted-foreground">Gestisci le tue informazioni anagrafiche e le preferenze di notifica di sistema.</p>
      </div>

      <form (ngSubmit)="saveProfile()" class="p-6 space-y-5">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-foreground">Nome Completo</label>
            <input type="text" [(ngModel)]="name" name="name" class="w-full bg-background border border-input rounded-md h-9 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
          
          <div class="space-y-1.5">
            <label class="text-xs font-semibold text-foreground">Azienda / Ente (Opzionale)</label>
            <input type="text" [(ngModel)]="company" name="company" class="w-full bg-background border border-input rounded-md h-9 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-ring" />
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-foreground">Indirizzo Email (Non modificabile)</label>
          <input type="email" [(ngModel)]="email" name="email" disabled class="w-full bg-muted border border-input rounded-md h-9 px-3 text-sm text-muted-foreground cursor-not-allowed" />
        </div>

        <div class="flex items-center justify-between border-t border-b border-border py-4 my-2">
          <div class="space-y-0.5">
            <p class="text-sm font-semibold tracking-tight">Notifiche Email</p>
            <p class="text-xs text-muted-foreground">Ricevi avvisi automatici quando un nuovo evento viene inserito nella tua città.</p>
          </div>
          <button type="button" (click)="notificationEnabled = !notificationEnabled" [class.bg-primary]="notificationEnabled" [class.bg-neutral-200]="!notificationEnabled" class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
            <span [class.translate-x-5]="notificationEnabled" [class.translate-x-0]="!notificationEnabled" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-background shadow-lg ring-0 transition duration-200 ease-in-out"></span>
          </button>
        </div>

        <div class="flex items-center justify-between pt-2">
          @if (saveSuccess) {
            <p class="text-xs font-semibold text-emerald-600">✓ Modifiche salvate con successo nel sistema.</p>
          } @else {
            <div></div>
          }
          <button type="submit" class="bg-primary text-primary-foreground text-sm font-medium rounded-md hover:bg-primary/90 h-9 px-5 transition-colors shadow-sm">Salva Impostazioni</button>
        </div>

      </form>

    </div>
  </div>
  <app-footer></app-footer>
</div>
