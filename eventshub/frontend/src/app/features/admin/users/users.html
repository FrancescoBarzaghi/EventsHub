<div class="min-h-screen bg-background flex flex-col justify-between">
  <div class="max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-6">
    
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-4 border-b border-border">
      <div>
        <h1 class="text-3xl font-bold font-serif-title tracking-tight mb-1">Pannello di Controllo Admin</h1>
        <p class="text-muted-foreground text-sm">Supervisiona le attività, modera i commenti e gestisci i permesses degli iscritti.</p>
      </div>

      <div class="inline-flex bg-muted p-1 rounded-md self-start sm:self-center">
        <button routerLink="/admin/moderation" class="text-muted-foreground hover:text-foreground text-xs font-semibold px-4 py-1.5 rounded transition-all">Moderazione</button>
        <button routerLink="/admin/users" class="bg-background shadow-sm text-foreground text-xs font-semibold px-4 py-1.5 rounded transition-all">Gestione Utenti</button>
      </div>
    </div>

    <div class="border border-border bg-card text-card-foreground rounded-lg shadow-sm overflow-hidden flex flex-col justify-between">
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-border bg-muted/50 text-muted-foreground text-xs uppercase font-bold tracking-wider">
              <th class="p-4">Utente / Nome</th>
              <th class="p-4">Email</th>
              <th class="p-4">Ruolo</th>
              <th class="p-4 text-center">Stato</th>
              <th class="p-4 text-center">Azione</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-border text-foreground">
            @for (u of usersList; track u.id) {
              <tr class="hover:bg-muted/30 transition-colors">
                <td class="p-4 font-bold text-sm tracking-tight">{{ u.name }}</td>
                <td class="p-4 text-xs text-muted-foreground font-mono">{{ u.email }}</td>
                <td class="p-4 text-xs text-muted-foreground font-medium">{{ u.role }}</td>
                <td class="p-4 text-center">
                  <span [class.bg-emerald-50]="u.status === 'Attivo'" [class.text-emerald-700]="u.status === 'Attivo'" [class.border-emerald-200]="u.status === 'Attivo'" [class.bg-rose-50]="u.status === 'Sospeso'" [class.text-rose-700]="u.status === 'Sospeso'" [class.border-rose-200]="u.status === 'Sospeso'" class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold border shadow-sm">
                    {{ u.status }}
                  </span>
                </td>
                <td class="p-4 text-center">
                  <button (click)="toggleStatus(u)" [class.text-destructive]="u.status === 'Attivo'" [class.text-emerald-600]="u.status === 'Sospeso'" class="text-xs font-bold hover:underline transition-all">
                    {{ u.status === 'Attivo' ? 'Sospendi' : 'Riattiva' }}
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>

  </div>
  <app-footer></app-footer>
</div>
